<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login — GoM3U</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="assets/favicon.png" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    padding: 32px 28px;
    text-align: center;
  }
  .login-card .field { text-align: left; margin-bottom: 14px; }
  .login-card label { font-size: 0.8rem; color: var(--text-dim); display:block; margin-bottom:6px; }
  .login-card input {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--panel-border);
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 0.9rem;
  }
  #login-error { color: var(--danger); font-size: 0.82rem; min-height: 18px; margin: 6px 0 12px; }
</style>
</head>
<body>

<div class="login-wrap">
  <form id="login-form" class="glass login-card" autocomplete="on">
    <div class="brand" style="justify-content:center; margin-bottom:6px;"><span class="dot"></span> GoM3U</div>
    <p style="color:var(--text-dim); margin-top:0; margin-bottom:22px;">Admin Sign In</p>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" />
    </div>

    <div id="login-error" role="alert"></div>

    <button id="login-btn" type="submit" class="btn btn-block">Sign In</button>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
